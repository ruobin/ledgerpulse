services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgerpulse-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - PORT=3000
    volumes:
      - ledgerpulse_data:/app/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgerpulse-worker
    restart: unless-stopped
    command: ["npx", "tsx", "src/worker/scheduler.ts"]
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ledgerpulse_data:/app/data
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: ledgerpulse-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  ledgerpulse_data:
  caddy_data:
  caddy_config:
